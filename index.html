<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Loader - 3D Open World</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; } /* Warna langit dasar */
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
        import { MTLLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/MTLLoader.js';
        import { OBJLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/OBJLoader.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js';

        // 1. Setup Scene, Camera, & Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);
        controls.update();

        // 2. Pencahayaan (Lighting)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // 3. Fungsi Load Karakter
        function loadCharacter(mtlPath, objPath, positionX) {
            const mtlLoader = new MTLLoader();
            // Path disesuaikan dengan struktur folder proyekmu
            mtlLoader.setPath('./assets/models/'); 
            
            mtlLoader.load(mtlPath, (materials) => {
                materials.preload();
                
                const objLoader = new OBJLoader();
                objLoader.setMaterials(materials);
                objLoader.setPath('./assets/models/');
                
                objLoader.load(objPath, (object) => {
                    object.position.set(positionX, 0, 0);
                    // Menyesuaikan skala jika model terlalu kecil/besar
                    object.scale.set(10, 10, 10); 
                    
                    object.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    
                    scene.add(object);
                });
            });
        }

        // Memuat Karakter Pria dan Wanita berdampingan
        loadCharacter('character-male-b.mtl', 'character-male-b.obj', -1);
        loadCharacter('character-female-b.mtl', 'character-female-b.obj', 1);

        // 4. Grid Helper untuk referensi lantai
        const gridHelper = new THREE.GridHelper(10, 10);
        scene.add(gridHelper);

        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
