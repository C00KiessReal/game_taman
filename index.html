<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Taman Bermain Roleplay</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="nametags-container"></div>
    
    <!-- LAYAR KUSTOMISASI KARAKTER (AVATAR SHOP / CREATOR) -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Kustomisasi Karakter</h2>
            <p>Buat identitas unikmu di taman!</p>
            
            <input type="text" id="username-input" placeholder="Ketik Username..." maxlength="15">
            
            <!-- Pilihan Gender -->
            <div class="custom-group">
                <label>Gender:</label>
                <select id="gender-select">
                    <option value="male">Laki-laki 👦</option>
                    <option value="female">Perempuan 👧</option>
                </select>
            </div>

            <!-- Pilihan Wajah / Kulit -->
            <div class="custom-group">
                <label>Warna Kulit:</label>
                <input type="color" id="skin-input" value="#ffcc99">
            </div>

            <!-- Pilihan Rambut -->
            <div class="custom-group">
                <label>Warna Rambut:</label>
                <input type="color" id="hair-color-input" value="#3d2314">
            </div>

            <!-- Bentuk Badan / Proporsi -->
            <div class="custom-group">
                <label>Bentuk Badan (Tinggi/Gempal):</label>
                <input type="range" id="body-scale-input" min="0.8" max="1.3" step="0.05" value="1">
            </div>

            <!-- Pilihan Baju -->
            <div class="custom-group">
                <label>Baju (Shirt):</label>
                <input type="color" id="shirt-input" value="#33aaff">
            </div>

            <!-- Pilihan Celana -->
            <div class="custom-group">
                <label>Celana (Pants):</label>
                <input type="color" id="pants-input" value="#1a237e">
            </div>

            <!-- Pilihan Sepatu -->
            <div class="custom-group">
                <label>Sepatu (Shoes):</label>
                <input type="color" id="shoes-input" value="#222222">
            </div>
            
            <button id="play-btn">Masuk ke Taman 🚀</button>
        </div>
    </div>

    <!-- UI DALAM GAME -->
    <div id="game-ui" style="display: none;">
        <div id="ui-container">
            <div id="chat-box"></div>
            <input type="text" id="chat-input" placeholder="Ketik untuk ngobrol...">
        </div>

        <div id="joystick-zone"></div>
        <div id="jump-btn">Lompat🦘</div>
        <div id="cam-btn">📷 Kamera</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
