<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Taman Bermain Roleplay</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="nametags-container"></div>
    
    <!-- LAYAR LOGIN / BUAT KARAKTER -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Masuk ke Taman</h2>
            <p>Buat karakter atau gunakan nama lamamu</p>
            <input type="text" id="username-input" placeholder="Ketik Username..." maxlength="15">
            
            <div class="color-picker-zone">
                <label>Pilih Warna Baju:</label>
                <input type="color" id="color-input" value="#ff3366">
            </div>
            
            <button id="play-btn">Main Sekarang!</button>
        </div>
    </div>

    <!-- UI Game (Sembunyi sebelum login) -->
    <div id="game-ui" style="display: none;">
        <div id="ui-container">
            <div id="chat-box"></div>
            <input type="text" id="chat-input" placeholder="Ketik untuk ngobrol...">
        </div>

        <div id="joystick-zone"></div>
        <div id="jump-btn">Lompat🦘</div>
        <div id="cam-btn">📷 Kamera</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
